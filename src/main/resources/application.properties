spring.application.name=account-password-reset-java

# 本地文件型 H2，保证重启后数据（凭据、会话、审计）不丢失
spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 业务安全参数
app.session-ttl=PT24H
app.reset-token-ttl=PT10M
app.reset-max-attempts=5
app.reset-request-window=PT10M
app.reset-request-max=3
app.outbox-dir=./data/outbox
