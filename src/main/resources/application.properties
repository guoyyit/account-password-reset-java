spring.application.name=account-password-reset

spring.datasource.url=jdbc:h2:file:./data/account-password-reset;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.security.session-ttl=12h
app.security.reset-token-ttl=15m
app.security.reset-rate-limit-max=3
app.security.reset-rate-limit-window=10m
